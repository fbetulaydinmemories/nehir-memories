36px #8472c85e}.track:after{content:"";position:absolute;left:0;right:0;top:calc(50% - 12px);height:25px;background:linear-gradient(90deg,transparent,#9991e31c,#84cee11a,transparent);filter:blur(11px);pointer-events:none}.node{position:relative;width:142px;height:250px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:0;background:transparent;color:inherit;padding:0;transition:transform .4s}.node:hover,.node.active{transform:scale(1.12)}.orb{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 45% 40%,#d1caff1f 0,#554a9c2c 23%,#090b1a 62%,#050713 100%);border:1px solid #a7a0df80;box-shadow:0 0 12px #afa5f29c,inset 0 0 23px #7b77c94d,0 0 52px #9a8bce44;z-index:1;animation:breathe 4s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;inset:-11px;border:1px solid #9b9dd43b;box-shadow:0 0 17px #a6a3d04a;transform:rotate(-24deg) scaleY(.76)}.orb:after{inset:-20px;border-color:#7c96b125;transform:rotate(38deg) scaleY(.9)}.node:nth-child(3n) .orb{border-color:#80c8da8a;box-shadow:0 0 15px #8bd9e38a,inset 0 0 25px #78c4dc44,0 0 56px #7cc9e344}.node:nth-child(3n) .orb:before{border-color:#7cd0d744}.orb .glyph{font-family:'Cormorant Garamond',serif;font-size:28px;color:#f2edff;text-shadow:0 0 15px #ddd2ff}.node.special .orb{width:55px;height:55px;border-style:dashed;transform:rotate(45deg);border-radius:13px}.node.special .glyph{transform:rotate(-45deg);font-size:24px}.year{position:absolute;top:14px;font-size:12px;letter-spacing:.22em;color:#d1cce8}.desc{position:absolute;bottom:14px;width:200px;text-align:center;color:#8589a6;font-size:10px;line-height:1.8;letter-spacing:.08em}.node.active .desc,.node:hover .desc{color:#c7c6e0}.node.active .orb{box-shadow:0 0 20px #d4c8ff,0 0 75px #ad9fe488,inset 0 0 30px #a19beb88}.node:focus-visible{outline:1px solid #c1b9ec;outline-offset:9px}.bottom{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw 30px;color:#8689a6;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.arrows{display:flex;gap:12px}.arrow,.sound{background:#151829aa;color:#c8c7e1;border:1px solid #777aa345;border-radius:50%;width:39px;height:39px;cursor:pointer}.arrow:hover,.sound:hover{border-color:#b1a8e6}.panel{position:fixed;inset:0;background:#040610ef;backdrop-filter:blur(22px);z-index:10;display:none;align-items:center;justify-content:center;padding:25px}.panel.show{display:flex}.panel-inner{width:min(700px,100%);min-height:360px;border:1px solid #817eaa45;background:radial-gradient(ellipse at center,#2823458a,#080a16 68%);box-shadow:0 0 120px #6e69c125;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 24px;position:relative}.panel h2{font-family:'Cormorant Garamond',serif;font-size:clamp(50px,9vw,90px);font-weight:400;margin:8px}.panel p{color:#a5a6bd;max-width:400px;font-size:13px;line-height:2}.close{position:absolute;top:18px;right:20px;border:0;background:none;color:#c7c5de;cursor:pointer;font-size:24px}.panel small{color:#8e8cae;letter-spacing:.3em;text-transform:uppercase}.notice{margin-top:18px;color:#9d9cb3;font-size:11px}.progress{position:fixed;bottom:0;left:0;height:2px;width:0;background:#b4a5ec;box-shadow:0 0 12px #b4a5ec;z-index:6;transition:width .2s}@keyframes breathe{50%{filter:brightness(1.4);transform:scale(1.05)}}@media(max-width:600px){.top{padding:20px 6vw}.top .hint{display:none}.intro{margin:7vh auto 0}.intro h1{font-size:62px}.linewrap{min-height:390px}.timeline{padding-left:28vw;padding-right:28vw}.track{gap:40px}.node{width:120px}.bottom{padding:12px 6vw 25px}.bottom>span{max-width:180px;line-height:1.8}}

</style></head><body><canvas id="space" aria-hidden="true"></canvas><main><header class="top"><div class="brand">N / B <span style="opacity:.35;margin:0 10px">—</span> ANILARIN ÖTESİNDE</div><div class="hint">İKİ HAYAT · TEK HİKÂYE</div></header><section class="intro"><div class="eyebrow">18 Eylül 2017'den beri</div><h1>Aramızdaki Zaman</h1><p>Bazı karşılaşmalar bir an sürer. Yankıları yıllarca devam eder.</p></section><section class="linewrap"><div class="timeline" id="timeline" aria-label="Yıllar arasında yatay zaman çizelgesi"><div class="track" id="track"></div></div></section><footer class="bottom"><span>← ZAMANDA İLERLEMEK İÇİN KAYDIR →</span><div class="arrows"><button class="arrow" id="prev" aria-label="Önceki yıllar">←</button><button class="arrow" id="next" aria-label="Sonraki yıllar">→</button></div><span>2017 — 2026 · BİZİM HİKÂYEMİZ</span></footer></main><div class="progress" id="progress"></div><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div class="panel-inner"><button class="close" id="close" aria-label="Kapat">×</button><small id="panelType">BÖLÜM</small><h2 id="panelTitle">2017</h2><p id="panelText"></p><div class="notice">Bu bölümün anı animasyonu ve resimli hikâyesi henüz eklenmedi.</div></div></div><script>
const events=[{y:'2017',t:'İlk karşılaşma',d:'Her şeyin başladığı okul bahçesi.'},{y:'2018',t:'Birlikte büyümek',d:'Yan yana geçen günlerin izleri.'},{y:'İstanbul',t:'2018 yazı · Özel durak',d:'Çanakkale–İstanbul–Edirne–Bursa yolculuğumuz.',special:true},{y:'2019',t:'Bir başka yıl',d:'Paylaşılan anılar.'},{y:'2020',t:'Uzakta da yakın',d:'Zamanın içinden geçen dostluk.'},{y:'2021',t:'Değişen dünyalar',d:'Birlikte biriktirdiklerimiz.'},{y:'2022',t:'Yollar ve anılar',d:'Yan yana kaldığımız zamanlar.'},{y:'2023',t:'Yeni başlangıçlar',d:'Mezuniyet, sınavlar ve yeni yollar.'},{y:'2024 Yılbaşı',t:'31 Aralık 2023 · Özel durak',d:'2023’ten 2024’e geçiş.',special:true},{y:'2024',t:'Hayat devam ederken',d:'Yeni anılar, eski dostluk.'},{y:'2025 Yılbaşı',t:'31 Aralık 2024 · Özel durak',d:'2024’ten 2025’e geçiş.',special:true},{y:'2025',t:'Birlikte geçen yıl',d:'Kutlamalar, yolculuklar, buluşmalar.'},{y:'2026 Yılbaşı',t:'31 Aralık 2025 · Özel durak',d:'Evde sushi ve birlikte karşıladığımız yeni yıl.',special:true},{y:'2026',t:'Hâlâ yan yana',d:'Yeni sayfalar ve devam eden hikâye.'},{y:'∞',t:'Anı kitabı',d:'Hikâyenin bitmediği kapı.',special:true}];
const track=document.getElementById('track'),scroller=document.getElementById('timeline');
events.forEach((e,i)=>{const b=document.createElement('button');b.className='node'+(e.special?' special':'')+(i===0?' active':'');b.innerHTML=`<span class="year">${e.y}</span><span class="orb"><span class="glyph">${e.special?(e.y==='∞'?'◇':'✧'):'·'}</span></span><span class="desc">${e.t}</span>`;b.addEventListener('click',()=>openPanel(e,b));track.appendChild(b)});
function openPanel(e,b){document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('panelType').textContent=e.special?'ÖZEL DURAK':'BÖLÜM';document.getElementById('panelTitle').textContent=e.y==='∞'?'Anı Kitabı':e.y;document.getElementById('panelText').textContent=e.d;document.getElementById('panel').classList.add('show');document.getElementById('close').focus()}
function closePanel(){document.getElementById('panel').classList.remove('show')}document.getElementById('close').onclick=closePanel;document.getElementById('panel').onclick=e=>{if(e.target.id==='panel')closePanel()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='ArrowRight')scroller.scrollBy({left:250,behavior:'smooth'});if(e.key==='ArrowLeft')scroller.scrollBy({left:-250,behavior:'smooth'})});
document.getElementById('prev').onclick=()=>scroller.scrollBy({left:-450,behavior:'smooth'});document.getElementById('next').onclick=()=>scroller.scrollBy({left:450,behavior:'smooth'});scroller.addEventListener('scroll',()=>{const m=scroller.scrollWidth-scroller.clientWidth;document.getElementById('progress').style.width=(m?scroller.scrollLeft/m*100:0)+'%'});
let drag=false,x0=0,left0=0;scroller.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){drag=true;x0=e.clientX;left0=scroller.scrollLeft;scroller.classList.add('dragging')}});window.addEventListener('pointerup',()=>{drag=false;scroller.classList.remove('dragging')});scroller.addEventListener('pointermove',e=>{if(drag){scroller.scrollLeft=left0-(e.clientX-x0)}});scroller.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();scroller.scrollLeft+=e.deltaY}},{passive:false});
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');let w,h,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
const stars=Array.from({length:95},(_,i)=>({x:(i*73.91%100)/100,y:(i*39.17%100)/100,r:.4+(i%4)*.3,p:i*.7}));let t=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){ctx.clearRect(0,0,w,h);let g=ctx.createRadialGradient(w*.48,h*.57,20,w*.48,h*.57,w*.7);g.addColorStop(0,'#292246');g.addColorStop(.35,'#11142d');g.addColorStop(1,'#040610');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
let glow=ctx.createRadialGradient(w*.45,h*.53,10,w*.45,h*.53,w*.34);glow.addColorStop(0,'#7974c015');glow.addColorStop(1,'#7974c000');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
stars.forEach(s=>{ctx.globalAlpha=.14+.22*(1+Math.sin(t*.018+s.p))/2;ctx.fillStyle='#d1d6ff';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
for(let j=0;j<5;j++){ctx.beginPath();let y0=h*(.53+(j-2)*.028);for(let x=0;x<=w;x+=4){let yy=y0+Math.sin(x*.009+t*.012+j*.9)*(8+j*3)+Math.sin(x*.024-t*.008+j)*4;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.strokeStyle=['#9f91ec27','#8ac9e72b','#e5c3ff19','#8b91ed2c','#b1a1f51c'][j];ctx.lineWidth=j===2?1.8:1;ctx.shadowBlur=20;ctx.shadowColor='#a49fe6';ctx.stroke()}ctx.shadowBlur=0;if(!reduce){t++;requestAnimationFrame(draw)}}draw();
</script></body></html>
